<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    main.counter {
      border: 1px solid #000000;
      padding: 2rem 3rem;
      text-align: center;
      min-width: 280px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .counter__field {
      margin-bottom: 1.5rem;
    }

    #counterDisplay {
      font-size: 3rem;
      font-weight: bold;
      display: block;
      margin-bottom: 0.25rem;
    }

    .counter__label {
      font-size: 0.85rem;
    }

    .counter__actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .counter__actions button {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
      min-width: 80px;
    }

    .counter__actions button:hover {
      background-color: #000000;
      color: #ffffff;
    }

    .counter__actions button:focus {
      outline: 2px solid #000000;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="counter">
    <h1>Contador</h1>

    <div class="counter__field">
      <span id="counterDisplay">0</span>
      <span class="counter__label">valor actual</span>
    </div>

    <div class="counter__actions">
      <button id="incrementButton" type="button">+1</button>
      <button id="decrementButton" type="button">-1</button>
      <button id="resetButton" type="button">Resetear</button>
    </div>
  </main>

  <!-- Load persistence helpers first, then counter logic -->
  <script src="/scripts/counter-store.js"></script>
  <script src="/scripts/counter.js"></script>
</body>
</html>
