<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contador</title>
    <style>
      /* Reset */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Base */
      body {
        font-family: sans-serif;
        background-color: #ffffff;
        color: #000000;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Counter card */
      main.counter {
        background-color: #ffffff;
        border: 1px solid #000000;
        padding: 2rem;
        width: 100%;
        max-width: 320px;
        text-align: center;
      }

      main.counter h1 {
        font-size: 1.5rem;
        font-weight: bold;
        color: #000000;
        margin-bottom: 1.5rem;
      }

      /* Field */
      .counter__field {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .counter__field label {
        font-size: 0.9rem;
        color: #000000;
      }

      .counter__field input[type='number'] {
        width: 6rem;
        padding: 0.4rem 0.6rem;
        font-size: 1.5rem;
        text-align: center;
        color: #000000;
        background-color: #ffffff;
        border: 1px solid #000000;
        outline: none;
      }

      /* Remove browser spinner arrows */
      .counter__field input[type='number']::-webkit-inner-spin-button,
      .counter__field input[type='number']::-webkit-outer-spin-button {
        -webkit-appearance: none;
      }

      .counter__field input[type='number'] {
        -moz-appearance: textfield;
        appearance: textfield;
      }

      /* Actions */
      .counter__actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
      }

      .counter__actions button {
        padding: 0.5rem 1.25rem;
        font-size: 1rem;
        font-weight: bold;
        color: #000000;
        background-color: #ffffff;
        border: 1px solid #000000;
        cursor: pointer;
      }

      .counter__actions button:hover {
        background-color: #000000;
        color: #ffffff;
      }

      .counter__actions button:active {
        background-color: #000000;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="counter">
      <h1>Contador</h1>

      <div class="counter__field">
        <label for="numero">Valor</label>
        <input type="number" id="numero" value="0" />
      </div>

      <div class="counter__actions">
        <button id="btn-restar" type="button">−</button>
        <button id="btn-sumar" type="button">+</button>
      </div>
    </main>
  </body>
</html>
