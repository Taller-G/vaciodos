<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contador</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        background-color: #ffffff;
        color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .counter {
        border: 1px solid #000000;
        padding: 2rem;
        width: 100%;
        max-width: 320px;
      }

      .counter h1 {
        font-size: 1.25rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }

      .counter__field {
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        margin-bottom: 1.25rem;
      }

      .counter__field label {
        font-size: 0.9rem;
        font-weight: bold;
      }

      .counter__field input[type="number"] {
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #000000;
        background-color: #ffffff;
        color: #000000;
        width: 100%;
      }

      .counter__field input[type="number"]:focus {
        outline: 2px solid #000000;
        outline-offset: 1px;
      }

      .counter__actions {
        display: flex;
        gap: 0.75rem;
      }

      .counter__actions button {
        flex: 1;
        padding: 0.6rem 1rem;
        font-size: 1rem;
        font-weight: bold;
        border: 1px solid #000000;
        background-color: #ffffff;
        color: #000000;
        cursor: pointer;
      }

      .counter__actions button:hover {
        background-color: #000000;
        color: #ffffff;
      }

      .counter__actions button:focus {
        outline: 2px solid #000000;
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <main class="counter">
      <h1>Contador</h1>

      <div class="counter__field">
        <label for="numero">Número</label>
        <input
          type="number"
          id="numero"
          name="numero"
          value="0"
          step="1"
        />
      </div>

      <div class="counter__actions">
        <button type="button" id="btn-restar">− Restar</button>
        <button type="button" id="btn-sumar">+ Sumar</button>
      </div>
    </main>
  </body>
</html>
